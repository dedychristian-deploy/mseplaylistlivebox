<!doctype html>
<html><head><meta charset="UTF-8"><style>
html,body{width:100%;height:100%;margin:0}body{background:transparent}
#layout{width:100%;height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:5px;padding:5px;box-sizing:border-box}
[data-box="BOX_06"]{grid-column:1/span 1;grid-row:1/span 1}
[data-box="BOX_04"]{grid-column:2/span 1;grid-row:1/span 1}
[data-box="BOX_02"]{grid-column:3/span 1;grid-row:1/span 1}
[data-box="BOX_07"]{grid-column:1/span 1;grid-row:2/span 1}
[data-box="BOX_05"]{grid-column:2/span 1;grid-row:2/span 1}
[data-box="BOX_03"]{grid-column:3/span 1;grid-row:2/span 1}
[data-box="BOX_01"]{grid-column:4/span 1;grid-row:1/span 2}
.box{background:#444;border:1px solid #777;display:flex;align-items:center;justify-content:center;color:white;font-family:Arial,sans-serif;font-size:clamp(12px,2.2vw,24px);position:relative;min-width:0;min-height:0}
.delete-box{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;cursor:pointer;font-size:18px}
</style></head><body><div id="layout"></div><script>
window.addEventListener("message",event=>{
 const data=event.data;if(!data||!Array.isArray(data.boxOrder))return;
 const layout=document.getElementById("layout");layout.innerHTML="";
 data.boxOrder.forEach(item=>{
  const boxName=item.box,input=item.input;
  const box=document.createElement("div");box.className="box";
  box.dataset.box=`BOX_${String(input+1).padStart(2,"0")}`;
  const label=document.createElement("span");label.textContent=`${boxName} - Input ${input}`;
  const del=document.createElement("button");del.className="delete-box";del.textContent="×";
  del.onclick=()=>window.parent.postMessage({action:"deleteBox",boxName},"*");
  box.append(label,del);layout.appendChild(box);
 });
});
</script></body></html>
