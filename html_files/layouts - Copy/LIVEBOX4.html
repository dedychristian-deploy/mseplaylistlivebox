<!doctype html>
<html>

<head>
    <meta charset="UTF-8">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            background: transparent;
        }

        #layout {
            width: 100%;
            height: 100%;

            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;

            gap: 5px;
            padding: 5px;
            box-sizing: border-box;
        }

        [data-box="BOX_01"] {
            grid-column: 2;
            grid-row: 1;
        }

        [data-box="BOX_02"] {
            grid-column: 2;
            grid-row: 2;
        }

        [data-box="BOX_03"] {
            grid-column: 1;
            grid-row: 1;
        }

        [data-box="BOX_04"] {
            grid-column: 1;
            grid-row: 2;
        }

        .box {
            background: #444;
            border: 1px solid #777;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-family: Arial, sans-serif;
            font-size: 24px;
        }

        .box {
            position: relative;
        }

        .delete-box {
            position: absolute;
            top: 8px;
            right: 8px;

            width: 28px;
            height: 28px;

            border: 0;
            cursor: pointer;

            font-size: 18px;
        }
    </style>
</head>

<body>

    <div id="layout"></div>

    <script>

        window.addEventListener("message", event => {

            const data = event.data;

            console.log("RECEIVED DATA:", data);

            const layout =
                document.getElementById("layout");

            layout.innerHTML = "";

            data.boxOrder.forEach(item => {

                const boxName = item.box;
                const input = item.input;

                const box =
                    document.createElement("div");

                box.className = "box";
                //box.dataset.box = boxName;
                box.dataset.box = `BOX_${String(input + 1).padStart(2, "0")}`;

                const label =
                    document.createElement("span");

                label.textContent =
                    `${boxName} - Input ${input}`;

                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "delete-box";

                deleteButton.textContent =
                    "×";

                deleteButton.onclick = () => {

                    console.log(
                        "DELETE CLICK:",
                        boxName
                    );

                    window.parent.postMessage(
                        {
                            action: "deleteBox",
                            boxName: boxName
                        },
                        "*"
                    );
                };

                box.appendChild(label);
                box.appendChild(deleteButton);

                layout.appendChild(box);
            });
        });

    </script>

</body>

</html>
