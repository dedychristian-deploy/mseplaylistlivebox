<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
        }

        .container {
            position: fixed;
            left: 20px;
            right: 20px;
            bottom: 20px;

            height: 33vh;

            display: flex;
            gap: 5px;
        }

        .panel {
            flex: 1;
            border: 1px solid #ccc;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;

            min-height: 0;
        }

        .panel h3 {
            margin: 0;
            padding: 12px;
            background: #eee;
            flex-shrink: 0;
        }

        #playlistList,
        #elementList {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }

        .item {
            padding: 10px 12px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .item:hover {
            background: #f3f3f3;
        }

        .item.selected {
            background: #ddd;
        }

        .top-area {
            position: fixed;
            left: 20px;
            right: 20px;
            top: 20px;
            bottom: calc(33vh + 45px);
            display: grid;
            grid-template-columns: 1fr 90px 1fr;
            gap: 5px;
            min-height: 0;
        }

        .preview-panel,
        .onair-panel {
            border: 1px solid #ccc;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .top-title {
            margin: 0;
            padding: 12px;
            background: #eee;
            font-size: 1.17em;
            font-weight: bold;
            flex-shrink: 0;
        }

        .preview-content,
        .onair-content {
            flex: 1;
            min-height: 0;
        }

        .control-panel {
            border: 1px solid #ccc;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            padding: 10px;
        }

        .control-panel button {
            width: 100%;
            padding: 12px 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>


<div class="top-area">

    <div class="preview-panel">
        <div class="top-title">Layout Preview</div>
        <div id="layoutPreview" class="preview-content"></div>
    </div>

    <div class="control-panel">
        <button type="button">TAKE</button>
        <button type="button">CONT</button>
        <button type="button">OUT</button>
    </div>

    <div class="onair-panel">
        <div class="top-title">On Air</div>
        <div id="onAir" class="onair-content"></div>
    </div>

</div>

<div class="container">

    <div class="panel">
        <h3>Playlists</h3>
        <div id="playlistList"></div>
    </div>

    <div class="panel">
        <h3>Elements</h3>
        <div id="elementList">
            Select playlist
        </div>
    </div>

</div>

    <script>

        const atom =
            "http://www.w3.org/2005/Atom";

        const elementCache =
            new Map();


        // ==========================================
        // LOAD PLAYLISTS
        // ==========================================

        async function loadPlaylists() {

            try {

                const response = await fetch(
                    "/api/playlists",
                    {
                        headers: {
                            Accept:
                                "application/atom+xml"
                        }
                    }
                );

                if (!response.ok) {

                    throw new Error(
                        `${response.status} ${response.statusText}`
                    );
                }


                const text =
                    await response.text();


                const xml =
                    new DOMParser()
                        .parseFromString(
                            text,
                            "application/xml"
                        );


                const entries =
                    xml.getElementsByTagNameNS(
                        atom,
                        "entry"
                    );


                const list =
                    document.getElementById(
                        "playlistList"
                    );


                list.innerHTML = "";


                for (const entry of entries) {

                    const title =
                        entry.getElementsByTagNameNS(
                            atom,
                            "title"
                        )[0]?.textContent ||
                        "Untitled";


                    const links =
                        entry.getElementsByTagNameNS(
                            atom,
                            "link"
                        );


                    let elementCollectionUrl = null;
                    let activationUrl = null;


                    for (const link of links) {

                        const rel =
                            link.getAttribute(
                                "rel"
                            );

                        const type =
                            link.getAttribute(
                                "type"
                            );


                        if (
                            rel === "alternate" &&
                            type ===
                            "application/atom+xml;type=feed"
                        ) {

                            elementCollectionUrl =
                                link.getAttribute(
                                    "href"
                                );
                        }


                        if (
                            rel === "related" &&
                            type ===
                            "application/vnd.vizrt.playlistactivation+xml"
                        ) {

                            activationUrl =
                                link.getAttribute(
                                    "href"
                                );
                        }
                    }


                    if (!elementCollectionUrl) {
                        continue;
                    }


                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "item";

                    item.textContent =
                        title;


                    item.onclick = () => {

                        document
                            .querySelectorAll(
                                "#playlistList .item"
                            )
                            .forEach(
                                x =>
                                    x.classList.remove(
                                        "selected"
                                    )
                            );


                        item.classList.add(
                            "selected"
                        );


                        activatePlaylist(
                            activationUrl
                        );


                        loadElements(
                            elementCollectionUrl
                        );
                    };


                    list.appendChild(
                        item
                    );
                }


            } catch (error) {

                console.error(
                    "LOAD PLAYLIST ERROR:",
                    error
                );
            }
        }



        // ==========================================
        // ACTIVATE PLAYLIST
        // ==========================================

        async function activatePlaylist(activationUrl) {
            if (!activationUrl) {
                console.error("Activation URL not found");
                return;
            }

            const match = activationUrl.match(/playlists\/(.+)$/);

            if (!match) {
                console.error("Cannot get playlist UUID:", activationUrl);
                return;
            }

            const uuid = match[1];

            console.log("ACTIVATING:", uuid);

            try {
                const response = await fetch(
                    `/api/activate/${encodeURIComponent(uuid)}`,
                    {
                        method: "PUT"
                    }
                );

                const result = await response.text();

                console.log("ACTIVATION STATUS:", response.status);
                console.log("ACTIVATION RESPONSE:", result);

                if (!response.ok) {
                    throw new Error(
                        `${response.status} ${response.statusText}: ${result}`
                    );
                }

                console.log("PLAYLIST ACTIVATED");
            } catch (error) {
                console.error("ACTIVATE PLAYLIST ERROR:", error);
            }
        }



        // ==========================================
        // LOAD ELEMENTS
        // ==========================================

        async function loadElements(url) {

            const list =
                document.getElementById(
                    "elementList"
                );


            list.innerHTML =
                "Loading...";


            try {

                const msePath =
                    new URL(url).pathname +
                    new URL(url).search;

                const response = await fetch(
                    `/api/elements?path=${encodeURIComponent(msePath)}`
                );


                if (!response.ok) {

                    throw new Error(
                        `${response.status} ${response.statusText}`
                    );
                }


                const text =
                    await response.text();


                const xml =
                    new DOMParser()
                        .parseFromString(
                            text,
                            "application/xml"
                        );


                const entries =
                    xml.getElementsByTagNameNS(
                        atom,
                        "entry"
                    );


                list.innerHTML = "";


                for (const entry of entries) {

                    const title =
                        entry.getElementsByTagNameNS(
                            atom,
                            "title"
                        )[0]?.textContent ||
                        "Untitled Element";


                    const id =
                        entry.getElementsByTagNameNS(
                            atom,
                            "id"
                        )[0]?.textContent ||
                        "";


                    const links =
                        entry.getElementsByTagNameNS(
                            atom,
                            "link"
                        );


                    let elementUrl =
                        null;


                    for (const link of links) {

                        if (
                            link.getAttribute(
                                "rel"
                            ) ===
                            "alternate"
                        ) {

                            elementUrl =
                                link.getAttribute(
                                    "href"
                                );

                            break;
                        }
                    }


                    if (!elementUrl) {
                        continue;
                    }


                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "item";

                    item.textContent =
                        title;


                    item.onclick = () => {

                        document
                            .querySelectorAll(
                                "#elementList .item"
                            )
                            .forEach(
                                x =>
                                    x.classList.remove(
                                        "selected"
                                    )
                            );


                        item.classList.add(
                            "selected"
                        );


                        console.log(
                            "ELEMENT:",
                            title
                        );


                        console.log(
                            "ID:",
                            id
                        );


                        getElementPayload(
                            elementUrl
                        );
                    };


                    list.appendChild(
                        item
                    );
                }


            } catch (error) {

                console.error(
                    "LOAD ELEMENTS ERROR:",
                    error
                );


                list.innerHTML =
                    "Error loading elements";
            }
        }



        // ==========================================
        // GET ELEMENT PAYLOAD
        // ==========================================

        async function getElementPayload(url) {

            if (elementCache.has(url)) {
                console.log("FROM CACHE");
                console.log("ELEMENT PAYLOAD:", elementCache.get(url));
                return elementCache.get(url);
            }

            const start = performance.now();

            try {

                const response = await fetch(
                    `/api/element?url=${encodeURIComponent(url)}`
                );

                if (!response.ok) {
                    throw new Error(
                        `${response.status} ${response.statusText}`
                    );
                }

                const payload = await response.text();

                elementCache.set(url, payload);

                console.log(
                    "MSE RESPONSE:",
                    Math.round(performance.now() - start),
                    "ms"
                );

                console.log("ELEMENT PAYLOAD:", payload);

                return payload;

            } catch (error) {
                console.error("GET ELEMENT ERROR:", error);
                return null;
            }
        }

        // ==========================================
        // START
        // ==========================================

        loadPlaylists();

    </script>

</body>

</html>
