<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0
        }

        body {
            background: transparent
        }

        #layout {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 5px;
            padding: 5px;
            box-sizing: border-box;
            animation: boxIn 220ms ease-out both
        }

        [data-box="BOX_02"] {
            grid-column: 1/span 1;
            grid-row: 1/span 1
        }

        [data-box="BOX_03"] {
            grid-column: 1/span 1;
            grid-row: 2/span 1
        }

        [data-box="BOX_01"] {
            grid-column: 2/span 1;
            grid-row: 1/span 2
        }

        .box {
            background: #292d32;
            border: 1px solid #3b424a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f2f4f7;
            font-family: Arial, sans-serif;
            font-size: clamp(12px, 2.2vw, 24px);
            font-weight: 600;
            position: relative;
            min-width: 0;
            min-height: 0;
            box-sizing: border-box;
            animation: boxIn 220ms ease-out both
        }

        .delete-box {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #20252b;
            color: #d7dce2;
            border: 1px solid #4a5159;
            border-radius: 2px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1
        }

        .delete-box:hover {
            background: #343a41;
            color: #fff;
            border-color: #68717b
        }

        @keyframes boxIn {
            from {
                opacity: 0;
                transform: scale(.96)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        .box-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-align: center;
            line-height: 1.1
        }

        .box-name {
            font-size: 1em;
            font-weight: 700;
            letter-spacing: .2px
        }

        .input-name {
            font-size: .72em;
            font-weight: 500;
            color: #aeb6be;
            letter-spacing: .45px;
            text-transform: uppercase
        }
    </style>
    <style id="layout-polish">
        .box {
            background: #272d33 !important;
            border: 1px solid #3a4650 !important;
            border-radius: 6px !important;
            overflow: hidden !important;
        }

        .box-label {
            gap: 6px !important;
        }

        .box-name {
            letter-spacing: .35px !important;
        }

        .input-name {
            color: #a7b2bc !important;
            letter-spacing: .55px !important;
        }

        .delete-box {
            top: 9px !important;
            right: 9px !important;
            width: 26px !important;
            height: 26px !important;
            background: #1b2229 !important;
            color: #b9c4ce !important;
            border: 1px solid #455462 !important;
            border-radius: 5px !important;
            font-size: 15px !important;
            transition: background .12s ease, color .12s ease, border-color .12s ease !important;
        }

        .delete-box:hover {
            background: #26323c !important;
            color: #fff !important;
            border-color: #667786 !important;
        }

        .live-stream {
            pointer-events: none !important;
            position: absolute;
            top: 50%;
            left: 50%;

            width: 100%;
            height: 100%;

            border: 0;
            z-index: 0;
            background: #000;

            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;
        }

        .box-label {
            position: absolute;
            left: 8px;
            bottom: 8px;
            z-index: 2;
            padding: 5px 8px;
            background: rgba(0, 0, 0, .65);
            border-radius: 4px;
            align-items: flex-start !important;
        }

        .delete-box {
            z-index: 3;
        }
    </style>


<style id="quick-zoom-style">
    .box { cursor: pointer; }

    #quickZoomModal {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(3, 8, 12, .82);
        backdrop-filter: blur(5px);
        font-family: Arial, sans-serif;
    }

    #quickZoomModal.open { display: flex; }

    .quick-zoom-dialog {
        width: min(76vw, 980px);
        background: #111922;
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(0,0,0,.55);
        overflow: hidden;
    }

    .quick-zoom-title {
        height: 68px;
        padding: 0 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #f2f4f7;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: .25px;
        background: #131c26;
        border-bottom: 1px solid #31404d;
        box-sizing: border-box;
    }

    .quick-zoom-title::before {
        /*content: "⚙";*/
        margin-right: 14px;
        color: #49a9f8;
        font-size: 21px;
    }

    .quick-zoom-title span {
        flex: 1;
    }

    #quickZoomClose {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        background: transparent;
        color: #8d99a5;
        font-size: 23px;
        font-weight: 700;
        cursor: pointer;
    }

    #quickZoomClose:hover { color: #fff; }

    .quick-zoom-body {
        padding: 28px 30px 20px;
    }

    .quick-zoom-preview {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        margin: 0;
        overflow: hidden;
        background: #05090d;
        border: 1px solid #36546c;
        border-radius: 10px;
        box-sizing: border-box;
    }

    .quick-zoom-stream {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
    }

    .quick-zoom-label {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 2;
        padding: 7px 10px;
        color: #fff;
        background: rgba(0,0,0,.72);
        border-radius: 5px;
        font-size: 14px;
        font-weight: 700;
    }

    .quick-zoom-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid #2c3945;
    }

    .quick-zoom-actions button {
        height: 38px;
        padding: 0 20px;
        border-radius: 8px;
        border: 1px solid #53616d;
        background: #202a33;
        color: #dce3e9;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
    }

    .quick-zoom-actions button:hover {
        background: #2a3540;
        color: #fff;
    }

    #quickZoomSend {
        min-width: 130px;
        background: #287bc4;
        border-color: #3b98e8;
        color: #fff;
    }

    .quick-zoom-dialog {
    border: 0.7px solid rgba(50, 139, 216, 0.25) !important;
}

    #quickZoomSend:hover { background: #3289d5; }
</style>


<style id="quick-zoom-compact-fix">
    #quickZoomModal {
        padding: 14px !important;
        box-sizing: border-box !important;
    }

    .quick-zoom-dialog {
        width: min(82vw, 720px) !important;
        max-height: calc(100vh - 28px) !important;
        border-radius: 12px !important;
        display: flex !important;
        flex-direction: column !important;
    }

    .quick-zoom-title {
        height: 48px !important;
        min-height: 48px !important;
        padding: 0 18px !important;
        font-size: 14px !important;
    }

    .quick-zoom-title::before {
        margin-right: 10px !important;
        font-size: 17px !important;
    }

    #quickZoomClose {
        width: 28px !important;
        height: 28px !important;
        font-size: 20px !important;
    }

    .quick-zoom-body {
        padding: 16px 18px 14px !important;
        min-height: 0 !important;
        overflow: auto !important;
    }

    .quick-zoom-preview {
        width: min(100%, calc((100vh - 150px) * 16 / 9)) !important;
        margin: 0 auto !important;
        aspect-ratio: 16 / 9 !important;
        border-radius: 7px !important;
    }

    .quick-zoom-actions {
        margin-top: 14px !important;
        padding-top: 12px !important;
        gap: 8px !important;
    }

    .quick-zoom-actions button {
        height: 34px !important;
        padding: 0 16px !important;
        border-radius: 6px !important;
        font-size: 11px !important;
    }

    #quickZoomSend {
        min-width: 118px !important;
    }

    .quick-zoom-label {
        left: 10px !important;
        bottom: 10px !important;
        padding: 6px 9px !important;
        font-size: 12px !important;
    }
</style>


<style id="quick-zoom-fit-final">
    #quickZoomModal {
        padding: 8px !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
    }

    .quick-zoom-dialog {
        width: min(82vw, 700px) !important;
        max-width: calc(100vw - 16px) !important;
        height: auto !important;
        max-height: calc(100vh - 16px) !important;
        border-radius: 12px !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
    }

    .quick-zoom-title {
        height: 46px !important;
        min-height: 46px !important;
        padding: 0 16px !important;
        font-size: 13px !important;
        flex: 0 0 46px !important;
    }

    .quick-zoom-body {
        padding: 12px 14px 12px !important;
        overflow: hidden !important;
        min-height: 0 !important;
        display: flex !important;
        flex-direction: column !important;
    }

    .quick-zoom-preview {
        width: min(
            100%,
            calc((100vh - 132px) * 16 / 9)
        ) !important;
        max-width: 100% !important;
        height: auto !important;
        aspect-ratio: 16 / 9 !important;
        margin: 0 auto !important;
        flex: 0 0 auto !important;
    }

    .quick-zoom-actions {
        flex: 0 0 42px !important;
        height: 42px !important;
        margin-top: 10px !important;
        padding-top: 10px !important;
        border-top: 1px solid #2c3945 !important;
        align-items: center !important;
    }

    .quick-zoom-actions button {
        height: 32px !important;
        padding: 0 16px !important;
        font-size: 10px !important;
    }

    #quickZoomSend {
        min-width: 116px !important;
    }

    .quick-zoom-label {
        left: 9px !important;
        bottom: 9px !important;
        padding: 5px 8px !important;
        font-size: 11px !important;
    }

    #quickZoomClose {
        font-size: 18px !important;
    }

    /* Absolutely no internal scrollbar in the modal */
    #quickZoomModal,
    .quick-zoom-dialog,
    .quick-zoom-body {
        scrollbar-width: none !important;
    }

    #quickZoomModal::-webkit-scrollbar,
    .quick-zoom-dialog::-webkit-scrollbar,
    .quick-zoom-body::-webkit-scrollbar {
        display: none !important;
    }
</style>


<style id="quick-zoom-fullframe-motion">
    /* Quick Zoom fills almost the entire Layout Preview iframe */
    #quickZoomModal {
        padding: 6px !important;
        overflow: hidden !important;
    }

    #quickZoomModal.open .quick-zoom-dialog {
        animation: quickZoomScaleIn 500ms cubic-bezier(.2,.8,.2,1) both !important;
    }

    .quick-zoom-dialog {
        width: calc(100vw - 12px) !important;
        max-width: none !important;
        height: calc(100vh - 12px) !important;
        max-height: none !important;
        border-radius: 11px !important;
        overflow: hidden !important;
        transform-origin: center center !important;
    }

    .quick-zoom-title {
        height: 44px !important;
        min-height: 44px !important;
        flex: 0 0 44px !important;
        padding: 0 16px !important;
        font-size: 13px !important;
    }

    .quick-zoom-body {
        flex: 1 1 auto !important;
        min-height: 0 !important;
        padding: 10px 12px 8px !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
    }

    .quick-zoom-preview {
        flex: 1 1 auto !important;
        min-height: 0 !important;
        width: 100% !important;
        max-width: none !important;
        height: auto !important;
        aspect-ratio: auto !important;
        margin: 0 !important;
        border-radius: 7px !important;
    }

    .quick-zoom-actions {
        flex: 0 0 36px !important;
        height: 36px !important;
        min-height: 36px !important;
        margin-top: 7px !important;
        padding-top: 7px !important;
        align-items: flex-start !important;
    }

    .quick-zoom-actions button {
        height: 30px !important;
        padding: 0 16px !important;
    }

    #quickZoomSend {
        min-width: 116px !important;
    }

    @keyframes quickZoomScaleIn {
        0% {
            opacity: 0;
            transform: scale(.90);
        }
        65% {
            opacity: 1;
            transform: scale(1.012);
        }
        100% {
            opacity: 1;
            transform: scale(1);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        #quickZoomModal.open .quick-zoom-dialog {
            animation: none !important;
        }
    }
</style>

</head>

<body>
    <div id="layout"></div>

    <div id="quickZoomModal">
        <div class="quick-zoom-dialog">
            <div class="quick-zoom-title">
                <span id="quickZoomTitle"></span>
                <button id="quickZoomClose" type="button" aria-label="Close"></button>
            </div>
            <div class="quick-zoom-body">
                <div class="quick-zoom-preview">
                    <iframe id="quickZoomStream" class="quick-zoom-stream" allow="autoplay; fullscreen"></iframe>
                    <div id="quickZoomLabel" class="quick-zoom-label">BOX 01 · LIVE INPUT 1</div>
                </div>
                <div class="quick-zoom-actions">
                    <button id="quickZoomCancel" type="button">CANCEL</button>
                    <button id="quickZoomSend" type="button">SEND TO VIZ</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedZoomInput = null;

        const quickZoomModal = document.getElementById("quickZoomModal");
        const quickZoomStream = document.getElementById("quickZoomStream");
        const quickZoomTitle = document.getElementById("quickZoomTitle");
        const quickZoomLabel = document.getElementById("quickZoomLabel");
        const quickZoomCancel = document.getElementById("quickZoomCancel");
        const quickZoomClose = document.getElementById("quickZoomClose");
        const quickZoomSend = document.getElementById("quickZoomSend");

        function openQuickZoom(input) {
            selectedZoomInput = input;
            //quickZoomTitle.textContent = `QUICK ZOOM — LIVE INPUT ${input + 1}`;
            quickZoomLabel.textContent = `BOX 01 · LIVE INPUT ${input + 1}`;
            quickZoomStream.src =
                `http://127.0.0.1:8889/aux${input + 1}?autoplay=true&muted=true&controls=false`;
            quickZoomModal.classList.add("open");
        }

        function closeQuickZoom() {
            quickZoomModal.classList.remove("open");
            quickZoomStream.src = "about:blank";
            selectedZoomInput = null;
        }

        quickZoomCancel.addEventListener("click", () => {
            closeQuickZoom();
        });

        quickZoomClose.addEventListener("click", () => {
            closeQuickZoom();
        });

        quickZoomSend.addEventListener("click", () => {
            if (selectedZoomInput === null) return;

            const zoomState = {
                boxType: 0,
                boxTypeName: "1BOX",
                boxOrder: [
                    {
                        box: "BOX_01",
                        input: selectedZoomInput
                    }
                ]
            };

            window.parent.postMessage({
                action: "quickZoomSendToViz",
                layoutData: zoomState
            }, "*");

            closeQuickZoom();
        });

        quickZoomModal.addEventListener("click", event => {
            if (event.target === quickZoomModal) {
                closeQuickZoom();
            }
        });

        window.addEventListener("message", event => {

            const data = event.data;

            if (!data || !Array.isArray(data.boxOrder)) {
                return;
            }

            const layout = document.getElementById("layout");
            layout.innerHTML = "";

            data.boxOrder.forEach(item => {

                const boxName = item.box;
                const input = item.input;

                const box = document.createElement("div");
                box.className = "box";

                box.addEventListener("dblclick", event => {
                    event.preventDefault();
                    event.stopPropagation();
                    openQuickZoom(input);
                });



                if (data.previewMode === "onair") {
                    box.dataset.box = boxName;
                } else {
                    box.dataset.box =
                        `BOX_${String(input + 1).padStart(2, "0")}`;
                }

                const stream = document.createElement("iframe");
                stream.className = "live-stream";
                stream.src =
                    `http://127.0.0.1:8889/aux${input + 1}?autoplay=true&muted=true&controls=false`;
                stream.allow = "autoplay; fullscreen";

                const label = document.createElement("div");
                label.className = "box-label";

                const boxLabel = document.createElement("span");
                boxLabel.className = "box-name";
                boxLabel.textContent = boxName.replace("_", " ");


                const inputLabel = document.createElement("span");
                inputLabel.className = "input-name";
                inputLabel.textContent = `LIVE INPUT ${input + 1}`;

                label.append(boxLabel, inputLabel);

                const del = document.createElement("button");
                del.className = "delete-box";
                del.textContent = "×";
                del.addEventListener("dblclick", event => event.stopPropagation());

                del.onclick = () =>
                    window.parent.postMessage(
                        {
                            action: "deleteBox",
                            boxName
                        },
                        "*"
                    );

                box.append(stream, label, del);
                layout.appendChild(box);
            });
        });
    </script>
</body>

</html>
