<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0
        }

        body {
            background: transparent
        }

        #layout {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 5px;
            padding: 5px;
            box-sizing: border-box
        }

        [data-box="BOX_04"] {
            grid-column: 1/span 1;
            grid-row: 1/span 1
        }

        [data-box="BOX_02"] {
            grid-column: 2/span 1;
            grid-row: 1/span 1
        }

        [data-box="BOX_05"] {
            grid-column: 1/span 1;
            grid-row: 2/span 1
        }

        [data-box="BOX_03"] {
            grid-column: 2/span 1;
            grid-row: 2/span 1
        }

        [data-box="BOX_01"] {
            grid-column: 3/span 1;
            grid-row: 1/span 2
        }

        .box {
            background: #292d32;
            border: 1px solid #3b424a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f2f4f7;
            font-family: Arial, sans-serif;
            font-size: clamp(12px, 2.2vw, 24px);
            font-weight: 600;
            position: relative;
            min-width: 0;
            min-height: 0;
            box-sizing: border-box;
            animation: boxIn 220ms ease-out both
        }

        @keyframes boxIn {
            from {
                opacity: 0;
                transform: scale(.96)
            }

            to {
                opacity: 1;
                transform: scale(1)
            }
        }

        .box-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-align: center;
            line-height: 1.1
        }

        .box-name {
            font-size: 1em;
            font-weight: 700;
            letter-spacing: .2px
        }

        .input-name {
            font-size: .72em;
            font-weight: 500;
            color: #aeb6be;
            letter-spacing: .45px;
            text-transform: uppercase
        }

        .delete-box {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #20252b;
            color: #d7dce2;
            border: 1px solid #4a5159;
            border-radius: 2px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1
        }

        .delete-box:hover {
            background: #343a41;
            color: #ffffff;
            border-color: #68717b
        }
    </style>

    <style id="layout-polish">
        .box {
            background: #272d33 !important;
            border: 1px solid #3a4650 !important;
            border-radius: 6px !important;
            overflow: hidden !important;
        }

        .box-label {
            gap: 6px !important;
        }

        .box-name {
            letter-spacing: .35px !important;
        }

        .input-name {
            color: #a7b2bc !important;
            letter-spacing: .55px !important;
        }

        .delete-box {
            top: 9px !important;
            right: 9px !important;
            width: 26px !important;
            height: 26px !important;
            background: #1b2229 !important;
            color: #b9c4ce !important;
            border: 1px solid #455462 !important;
            border-radius: 5px !important;
            font-size: 15px !important;
            transition: background .12s ease, color .12s ease, border-color .12s ease !important;
        }

        .delete-box:hover {
            background: #26323c !important;
            color: #fff !important;
            border-color: #667786 !important;
        }

        .live-stream {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            z-index: 0;
            background: #000;
        }

        .box-label {
            position: absolute;
            left: 8px;
            bottom: 8px;
            z-index: 2;
            padding: 5px 8px;
            background: rgba(0, 0, 0, .65);
            border-radius: 4px;
            align-items: flex-start !important;
        }

        .delete-box {
            z-index: 3;
        }
    </style>

</head>

<body>
    <div id="layout"></div>
    <script>
        window.addEventListener("message", event => {

            const data = event.data;

            if (!data || !Array.isArray(data.boxOrder)) {
                return;
            }

            const layout = document.getElementById("layout");
            layout.innerHTML = "";

            data.boxOrder.forEach(item => {

                const boxName = item.box;
                const input = item.input;

                const box = document.createElement("div");
                box.className = "box";

                if (data.previewMode === "onair") {
                    box.dataset.box = boxName;
                } else {
                    box.dataset.box =
                        `BOX_${String(input + 1).padStart(2, "0")}`;
                }

                if (data.previewMode === "onair") {
                    box.dataset.box = boxName;
                } else {
                    box.dataset.box =
                        `BOX_${String(input + 1).padStart(2, "0")}`;
                }

                const stream = document.createElement("iframe");
                stream.className = "live-stream";
                stream.src =
                    `http://127.0.0.1:8889/aux${input + 1}?autoplay=true&muted=true&controls=false`;
                stream.allow = "autoplay; fullscreen";

                const label = document.createElement("div");
                label.className = "box-label";

                const boxLabel = document.createElement("span");
                boxLabel.className = "box-name";
                boxLabel.textContent = boxLabel.textContent = boxLabel.textContent = `BOX ${String(input + 1).padStart(2, "0")}`;


                const inputLabel = document.createElement("span");
                inputLabel.className = "input-name";
                inputLabel.textContent = `LIVE INPUT ${input + 1}`;

                label.append(boxLabel, inputLabel);

                const del = document.createElement("button");
                del.className = "delete-box";
                del.textContent = "×";

                del.onclick = () =>
                    window.parent.postMessage(
                        {
                            action: "deleteBox",
                            boxName
                        },
                        "*"
                    );

                box.append(stream, label, del);
                layout.appendChild(box);
            });
        });
    </script>
</body>

</html>
