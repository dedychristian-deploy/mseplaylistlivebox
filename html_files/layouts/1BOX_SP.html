<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0
        }

        body {
            background: transparent
        }

        #layout {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            grid-template-rows: repeat(1, 1fr);
            gap: 5px;
            padding: 5px;
            box-sizing: border-box;
            animation: boxIn 500ms ease-out both
        }

        [data-box="BOX_01"] {
            grid-column: 1/span 1;
            grid-row: 1/span 1
        }

        .box {
            background: #292d32;
            border: 1px solid #3b424a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f2f4f7;
            font-family: Arial, sans-serif;
            font-size: clamp(12px, 2.2vw, 24px);
            font-weight: 600;
            position: relative;
            min-width: 0;
            min-height: 0;
            box-sizing: border-box;
            animation: boxIn 500ms ease-out both
        }

        .delete-box {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #20252b;
            color: #d7dce2;
            border: 1px solid #4a5159;
            border-radius: 2px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1
        }

        .delete-box:hover {
            background: #343a41;
            color: #fff;
            border-color: #68717b
        }

        @keyframes boxIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .box-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-align: center;
            line-height: 1.1
        }

        .box-name {
            font-size: 1em;
            font-weight: 700;
            letter-spacing: .2px
        }

        .input-name {
            font-size: .72em;
            font-weight: 500;
            color: #aeb6be;
            letter-spacing: .45px;
            text-transform: uppercase
        }
    </style>

    <style id="layout-polish">
        .box {
            background: #272d33 !important;
            border: 1px solid #3a4650 !important;
            border-radius: 6px !important;
            overflow: hidden !important;
        }

        .box-label {
            gap: 6px !important;
        }

        .box-name {
            letter-spacing: .35px !important;
        }

        .input-name {
            color: #a7b2bc !important;
            letter-spacing: .55px !important;
        }

        .delete-box {
            top: 9px !important;
            right: 9px !important;
            width: 26px !important;
            height: 26px !important;
            background: #1b2229 !important;
            color: #b9c4ce !important;
            border: 1px solid #455462 !important;
            border-radius: 5px !important;
            font-size: 15px !important;
            transition: background .12s ease, color .12s ease, border-color .12s ease !important;
        }

        .delete-box:hover {
            background: #26323c !important;
            color: #fff !important;
            border-color: #667786 !important;
        }

        .live-stream {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 100%;
            height: 100%;

            border: 0;
            z-index: 0;
            background: #000;

            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;
        }

        .box-label {
            position: absolute;
            left: 8px;
            bottom: 8px;
            z-index: 2;
            padding: 5px 8px;
            background: rgba(0, 0, 0, .65);
            border-radius: 4px;
            align-items: flex-start !important;
        }

        .delete-box {
            z-index: 3;
        }
    </style>


<style id="quick-zoom-overlay-final">
    .box { cursor: pointer; }
    .live-stream { pointer-events: none !important; }

    #quickZoomModal {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        padding: 5px;
        box-sizing: border-box;
        background: rgba(4, 8, 12, .64);
        font-family: Arial, sans-serif;
    }

    #quickZoomModal.open {
        display: block;
        animation: quickZoomOpen 500ms ease both;
    }

    #quickZoomModal.closing {
        animation: quickZoomClose 350ms ease both;
    }

    .quick-zoom-dialog {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05090d;
        border: 1px solid rgba(72, 106, 132, .55);
        border-radius: 6px;
        box-shadow: 0 12px 38px rgba(0,0,0,.42);
    }

    .quick-zoom-body, .quick-zoom-preview {
        position: absolute;
        inset: 0;
    }

    .quick-zoom-preview {
        overflow: hidden;
        background: #000;
    }

    .quick-zoom-stream {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
    }

    .quick-zoom-label {
        position: absolute;
        left: 12px;
        bottom: 12px;
        z-index: 4;
        padding: 6px 9px;
        color: #fff;
        background: rgba(0,0,0,.68);
        border-radius: 4px;
        font-size: 12px;
        font-weight: 700;
    }

    .quick-zoom-actions {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 6;
        display: flex;
        gap: 7px;
    }

    .quick-zoom-actions button {
        height: 32px;
        padding: 0 15px;
        border: 1px solid rgba(92,108,121,.78);
        border-radius: 5px;
        background: rgba(24,32,39,.9);
        color: #dce4ea;
        font-family: Arial,sans-serif;
        font-size: 10px;
        font-weight: 800;
        cursor: pointer;
    }

    #quickZoomSend {
        min-width: 116px;
        background: rgba(40,123,196,.94);
        border-color: #3b98e8;
        color: #fff;
    }

    @keyframes quickZoomOpen {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes quickZoomClose {
        from { opacity: 1; }
        to { opacity: 0; }
    }
</style>

</head>

<body>
    <div id="layout"></div>

<div id="quickZoomModal">
    <div class="quick-zoom-dialog">
        <div class="quick-zoom-body">
            <div class="quick-zoom-preview">
                <iframe id="quickZoomStream" class="quick-zoom-stream" allow="autoplay; fullscreen"></iframe>
                <div id="quickZoomLabel" class="quick-zoom-label"></div>
            </div>
            <div class="quick-zoom-actions">
                <button id="quickZoomCancel" type="button">CANCEL</button>
                <button id="quickZoomSend" type="button">SEND TO VIZ</button>
            </div>
        </div>
    </div>
</div>

    <script>

        let selectedZoomInput = null;
        const quickZoomModal = document.getElementById("quickZoomModal");
        const quickZoomStream = document.getElementById("quickZoomStream");
        const quickZoomLabel = document.getElementById("quickZoomLabel");
        const quickZoomCancel = document.getElementById("quickZoomCancel");
        const quickZoomSend = document.getElementById("quickZoomSend");

        function openQuickZoom(input) {
            selectedZoomInput = input;
            quickZoomLabel.textContent = `BOX 01 · LIVE INPUT ${input + 1}`;
            quickZoomStream.src =
                `http://127.0.0.1:8889/aux${input + 1}?autoplay=true&muted=true&controls=false`;
            quickZoomModal.classList.remove("closing");
            quickZoomModal.classList.add("open");
        }

        function closeQuickZoom() {
            if (!quickZoomModal.classList.contains("open")) return;
            quickZoomModal.classList.add("closing");
            setTimeout(() => {
                quickZoomModal.classList.remove("open", "closing");
                quickZoomStream.src = "about:blank";
                selectedZoomInput = null;
            }, 350);
        }

        quickZoomCancel.addEventListener("click", closeQuickZoom);

        quickZoomSend.addEventListener("click", () => {
            if (selectedZoomInput === null) return;
            window.parent.postMessage({
                action: "quickZoomSendToViz",
                layoutData: {
                    boxType: 0,
                    boxTypeName: "1BOX",
                    boxOrder: [{ box: "BOX_01", input: selectedZoomInput }]
                }
            }, "*");
            closeQuickZoom();
        });

        quickZoomModal.addEventListener("click", event => {
            if (event.target === quickZoomModal) closeQuickZoom();
        });

        window.addEventListener("message", event => {

            const data = event.data;

            if (!data || !Array.isArray(data.boxOrder)) {
                return;
            }

            const layout = document.getElementById("layout");
            layout.innerHTML = "";

            data.boxOrder.forEach(item => {

                const boxName = item.box;
                const input = item.input;

                const box = document.createElement("div");
                box.className = "box";
                box.addEventListener("dblclick", event => { event.preventDefault(); event.stopPropagation(); openQuickZoom(input); });



                if (data.previewMode === "onair") {
                    box.dataset.box = boxName;
                } else {
                   // box.dataset.box =`BOX_${String(input + 1).padStart(2, "0")}`;
                    box.dataset.box = boxName;
                }

                const stream = document.createElement("iframe");
                stream.className = "live-stream";
                stream.src =
                    `http://127.0.0.1:8889/aux${input + 1}?autoplay=true&muted=true&controls=false`;
                stream.allow = "autoplay; fullscreen";

                const label = document.createElement("div");
                label.className = "box-label";

                const boxLabel = document.createElement("span");
                boxLabel.className = "box-name";
                //boxLabel.textContent = `BOX ${String(input + 1).padStart(2, "0")}`;
                boxLabel.textContent = boxName.replace("_", " ");


                const inputLabel = document.createElement("span");
                inputLabel.className = "input-name";
                inputLabel.textContent = `LIVE INPUT ${input + 1}`;

                label.append(boxLabel, inputLabel);

                const del = document.createElement("button");
                del.className = "delete-box";
                del.textContent = "×";
                del.addEventListener("dblclick", event => event.stopPropagation());

                del.onclick = () =>
                    window.parent.postMessage(
                        {
                            action: "deleteBox",
                            boxName
                        },
                        "*"
                    );

                box.append(stream, label, del);
                layout.appendChild(box);
            });
        });
    </script>
</body>

</html>
